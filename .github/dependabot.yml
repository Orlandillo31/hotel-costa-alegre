# Dependabot revisa cada semana si hay versiones nuevas de las librerías
# (sobre todo parches de seguridad) y abre un Pull Request para actualizarlas.
# Las pruebas automáticas corren sobre ese PR antes de que decidas aceptarlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
