# Respaldo diario de la base de datos (cifrado con BACKUP_PASSWORD).
# Cada copia queda 30 días en: GitHub → Actions → "Respaldo de la base de datos"
# → la ejecución del día → Artifacts. Para restaurar: npm run restaurar -- archivo.vcbk
#
# Requiere dos "secrets" del repositorio (Settings → Secrets and variables → Actions):
#   MONGODB_URI      la misma cadena de conexión que usa Render
#   BACKUP_PASSWORD  contraseña larga para cifrar (guárdala en un lugar seguro:
#                    sin ella los respaldos NO se pueden abrir)
name: Respaldo de la base de datos

on:
  schedule:
    - cron: '0 9 * * *'     # todos los días, 3:00 a. m. hora del centro de México
  workflow_dispatch:         # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Crear respaldo cifrado
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: node server/scripts/respaldo.js respaldo.vcbk
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_number }}
          path: respaldo.vcbk
          retention-days: 30
